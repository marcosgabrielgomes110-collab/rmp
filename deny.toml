# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# Checked in CI. Run locally with:  cargo deny check

[graph]
all-features = true

[advisories]
version = 2
# Unmaintained-only advisories for transitive dependencies we cannot upgrade
# without breaking changes upstream. They are not vulnerabilities:
#   RUSTSEC-2023-0089  atomic-polyfill (unmaintained) ← heapless ← postcard
#   RUSTSEC-2017-0008  serial (unmaintained) ← portable-pty
# Revisit when postcard/portable-pty drop them.
ignore = ["RUSTSEC-2023-0089", "RUSTSEC-2017-0008"]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "ISC",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unlicense",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "NCSA",
]

[bans]
multiple-versions = "warn"
# Internal workspace crates are declared with `path` only (no version), which
# cargo-deny would otherwise treat as wildcard requirements.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
